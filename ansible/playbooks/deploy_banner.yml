---

Deploy New Banner to EOS Switches
  hosts: WORKSHOP_FABRIC

  tasks:

    Gather EOS Facts
      arista.eos.eos_facts:
        gather_subset: all
      register: facts

    Debugging - Check Facts Output
      debug:
        msg: "{{ facts }}"

    configure the login banner
      arista.eos.eos_banner:
        banner: motd
        text: |
          "{{ banner_text }}"
        state: present